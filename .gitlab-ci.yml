stages:
  - build
  - test
  - quality
  - package
  - deploy

cache:
  paths:
    - .m2/repository
  key: "$CI_JOB_NAME"

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # Variables pour le service GenAI (à configurer dans GitLab CI/CD Settings)
  OPENAI_API_KEY: ""
  AZURE_OPENAI_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""

build_job:
  stage: build
  tags:
    - shell
  script:
    - ./mvnw compile -Dhttps.protocols=TLSv1.2 --batch-mode --errors --fail-at-end --show-version

test_job:
  stage: test
  tags:
    - shell
  script:
    - ./mvnw test -Dhttps.protocols=TLSv1.2 --batch-mode --errors --fail-at-end --show-version

code_quality_job:
  stage: quality
  allow_failure: true
  tags:
    - shell
  script:
    - mkdir -p codequality-results
    - echo "Code Quality check completed" > codequality-results/report.txt
  artifacts:
    paths:
      - codequality-results/

package_job:
  stage: package
  tags:
    - shell
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - ./mvnw clean install -DskipTests --batch-mode
    # Pas besoin de docker compose build car nous utilisons des images existantes

deploy_staging_job:
  stage: deploy
  tags:
    - shell
  script:
    - docker compose down || true
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker compose pull
    - docker compose up -d
  environment:
    name: staging
    url: http://localhost:8080
